[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dncrypt"
version = "0.2.0"
description = "DNCrypt v0.2 — vectorized adversarial evolution core with provenance-preserving AEAD"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
