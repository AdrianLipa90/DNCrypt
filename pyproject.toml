[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dncrypt"
version = "0.6.2a0"
description = "DNCrypt — provenance-preserving AEAD with causal evolution, bounded Genetic IR operators, candidate policy compilation, unified rollback, and hierarchical 36D diagnostics"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.112"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
