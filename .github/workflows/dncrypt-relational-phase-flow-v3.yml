name: DNCrypt NOEMA relational phase-flow v3

on:
  push:
    branches:
      - experiment/relational-prime-phase-flow-v3-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relational-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Pure relational core conformance
        run: python -m pytest -q tests/test_relational_phase_flow_core_v3.py
      - name: DNCrypt adapter conformance
        run: python -m pytest -q tests/test_relational_phase_flow_v3_challenge.py
      - name: Preregistered paired ciphertext validation
        run: |
          python tools/relational_phase_flow_v3_challenge.py \
            --output relational_v3_validation.json \
            --replicates 24 \
            --population-size 12 \
            --folds 6 \
            --fold-messages 16 \
            --holdout-messages 64 \
            --message-bytes 128
      - uses: actions/upload-artifact@v4
        with:
          name: dncrypt-relational-phase-flow-v3
          path: relational_v3_validation.json
          if-no-files-found: error