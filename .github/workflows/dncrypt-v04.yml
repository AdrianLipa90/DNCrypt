name: DNCrypt v0.4

on:
  pull_request:
  push:
    branches:
      - feat/dncrypt-v0.4-generalization-aware-evolution

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Test
        run: python -m pytest
