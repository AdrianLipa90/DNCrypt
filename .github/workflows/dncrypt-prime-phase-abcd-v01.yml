name: DNCrypt NOEMA prime-phase A-B-C-D

on:
  push:
    branches:
      - experiment/noema-prime-phase-abcd-20260926
    paths:
      - 'tools/prime_phase_abcd_challenge_v01.py'
      - 'tests/test_prime_phase_abcd_challenge_v01.py'
      - 'docs/PRIME_PHASE_ABCD_CHALLENGE_V0_1.md'
      - '.github/workflows/dncrypt-prime-phase-abcd-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime-phase-abcd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: A-B-C-D conformance tests
        run: python -m pytest -q tests/test_prime_phase_abcd_challenge_v01.py
      - name: Paired actual-ciphertext pilot
        run: |
          python tools/prime_phase_abcd_challenge_v01.py \
            --output abcd_pilot.json \
            --replicates 8 \
            --population-size 12 \
            --folds 6 \
            --fold-messages 16 \
            --holdout-messages 64 \
            --message-bytes 128
      - name: Upload pilot receipt
        uses: actions/upload-artifact@v4
        with:
          name: dncrypt-noema-prime-phase-abcd-v01
          path: abcd_pilot.json
          if-no-files-found: error
