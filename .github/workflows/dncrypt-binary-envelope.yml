name: DNCrypt binary envelope

on:
  push:
    branches:
      - feat/dncrypt-v0.4-binary-envelope
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_binary_envelope_v01.py tests/test_dncrypt.py
