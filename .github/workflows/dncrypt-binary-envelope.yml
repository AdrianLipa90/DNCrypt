name: DNCrypt binary envelope

on:
  push:
    branches:
      - main
    paths:
      - 'src/dncrypt/crypto.py'
      - 'src/dncrypt/binary_envelope.py'
      - 'tests/test_binary_envelope_v01.py'
      - 'tests/test_crypto_hardening_v051.py'
      - '.github/workflows/dncrypt-binary-envelope.yml'
  pull_request:
    paths:
      - 'src/dncrypt/crypto.py'
      - 'src/dncrypt/binary_envelope.py'
      - 'tests/test_binary_envelope_v01.py'
      - 'tests/test_crypto_hardening_v051.py'
      - '.github/workflows/dncrypt-binary-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_binary_envelope_v01.py tests/test_crypto_hardening_v051.py tests/test_dncrypt.py
